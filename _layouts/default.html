<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.beschrijving | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  {%- assign versie = site.time | date: '%s' %}
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}?v={{ versie }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}?v={{ versie }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}?v={{ versie }}">
  <meta name="theme-color" content="#c2502a">
  <!-- Linkvoorbeeld in WhatsApp, iMessage, Facebook enz. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.beschrijving | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.foto | default: '/assets/apple-touch-icon.png' | absolute_url }}">
  <meta property="og:locale" content="nl_NL">
  <meta name="twitter:card" content="{% if page.foto %}summary_large_image{% else %}summary{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ versie }}">
  <script>
    // Beheerknoppen alleen tonen na één keer openen via ?beheer (uitzetten met ?uit)
    (function () {
      var q = location.search, aan = false;
      try {
        if (/[?&]beheer\b/.test(q)) localStorage.setItem('kookboek-beheer', '1');
        if (/[?&]uit\b/.test(q)) localStorage.removeItem('kookboek-beheer');
        aan = localStorage.getItem('kookboek-beheer') === '1';
      } catch (e) { aan = /[?&]beheer\b/.test(q); }
      if (aan) document.documentElement.classList.add('is-beheer');
    })();
  </script>
  <script src="{{ '/assets/lijst.js' | relative_url }}?v={{ versie }}"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="30" height="30"> {{ site.title }}</a>
      <a class="lijst-link" href="{{ '/boodschappen/' | relative_url }}"><span aria-hidden="true">🛒</span> Boodschappen <span class="teller" id="lijstTeller" hidden></span></a>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap footer">
    <p>{{ site.title }} · gemaakt met liefde en boter</p>
  </footer>
</body>
</html>
